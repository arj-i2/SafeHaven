
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Form | SafeHaven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #F4F0EC; color: #302522; }
        .navbar { background: #211C1B; }
        .navbar-brand span { color: #F36B32; }
        .nav-link-custom { color: #F4F0EC; text-decoration: none; margin-left: 20px; }
        .nav-link-custom:hover { color: #F36B32; }
        .form-card { background: white; border: 1px solid #E9DFD8; border-radius: 14px; }
        .form-control, .form-select {
            border: 1px solid #D9CCC4;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #F36B32;
            box-shadow: 0 0 0 3px rgba(243,107,50,.15);
        }
        .btn-lava { background: #C43D24; color: white; border: none; }
        .btn-lava:hover { background: #9F2F1D; color: white; }
        .btn-cancel { background: #E9DFD8; color: #302522; border: none; }
        .btn-cancel:hover { background: #D9CCC4; color: #211C1B; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand fw-bold">
            Safe<span>Haven</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto align-items-lg-center">
                <a href="{% url 'home' %}" class="nav-link-custom py-2">Home</a>
                <a href="{% url 'dashboard' %}" class="nav-link-custom py-2">Dashboard</a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="form-card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="p-4 p-md-5">
            <h3 class="fw-bold mb-2">Resource Information</h3>
            <p class="text-secondary mb-4">Enter the details of the emergency resource.</p>

            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}

                    {% if field.help_text %}
                    <div class="form-text">{{ field.help_text }}</div>
                    {% endif %}

                    {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn btn-lava px-4">Save Resource</button>
                    <a href="{% url 'resource_list' %}" class="btn btn-cancel px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
