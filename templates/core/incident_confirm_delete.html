
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Incident | SafeHaven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --dark: #211C1B;
            --dark-soft: #302522;
            --red: #C43D24;
            --red-dark: #9F2F1D;
            --orange: #F36B32;
            --background: #F4F0EC;
            --text: #302522;
            --muted: #81736D;
            --border: #E9DFD8;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: var(--dark);
            padding: 15px 0;
        }

        .navbar-brand {
            color: white !important;
            font-size: 23px;
            font-weight: 700;
        }

        .navbar-brand span {
            color: var(--orange);
        }

        .nav-link-custom {
            color: #D8CBC4;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
        }

        .nav-link-custom:hover {
            color: var(--orange);
        }

        .page-container {
            max-width: 540px;
            margin: 70px auto;
        }

        .delete-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(33, 28, 27, 0.06);
        }

        .delete-header {
            background: linear-gradient(120deg, var(--dark), var(--red-dark));
            color: white;
            padding: 25px;
            text-align: center;
        }

        .delete-header h3 {
            font-weight: 700;
            margin: 0;
        }

        .delete-body {
            padding: 30px;
            text-align: center;
        }

        .delete-body p {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .incident-title {
            display: block;
            background: #F8F4F1;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0 25px;
            color: var(--dark);
            font-size: 18px;
            font-weight: 700;
        }

        .warning-text {
            color: var(--red) !important;
            font-size: 13px;
        }

        .btn-delete {
            background: var(--red);
            color: white;
            border: none;
            border-radius: 7px;
            padding: 11px 20px;
            font-weight: 600;
        }

        .btn-delete:hover {
            background: var(--red-dark);
            color: white;
        }

        .btn-cancel {
            background: #EEE9E5;
            color: var(--dark-soft);
            border: none;
            border-radius: 7px;
            padding: 11px 20px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: #DED5CE;
            color: var(--dark);
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-top: 30px;
        }

        @media (max-width: 576px) {
            .page-container {
                margin: 35px 15px;
            }

            .delete-body {
                padding: 24px 18px;
            }

            .navbar-brand {
                font-size: 20px;
            }

            .nav-link-custom {
                margin-left: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand">
            Safe<span>Haven</span>
        </a>

        <div class="d-flex align-items-center">
            <a href="{% url 'home' %}" class="nav-link-custom">Home</a>
            <a href="{% url 'dashboard' %}" class="nav-link-custom">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container page-container">

    <div class="delete-card">

        <div class="delete-header">
            <h3>Delete Incident</h3>
        </div>

        <div class="delete-body">

            <p>Are you sure you want to delete this incident?</p>

            <span class="incident-title">
                {{ incident.title }}
            </span>

            <p class="warning-text">
                This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn-delete">
                        Yes, Delete
                    </button>

                    <a href="{% url 'incident_list' %}" class="btn-cancel">
                        Cancel
                    </a>
                </div>
            </form>

        </div>
    </div>

    <footer class="footer">
        SafeHaven &copy; 2026 | Community Disaster Preparedness System
    </footer>

</div>

</body>
</html>
