
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Resource | SafeHaven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #F4F0EC; color: #302522; }
        .navbar { background: #211C1B; }
        .navbar-brand span { color: #F36B32; }
        .nav-link-custom { color: #F4F0EC; text-decoration: none; margin-left: 20px; }
        .nav-link-custom:hover { color: #F36B32; }
        .delete-card { background: white; border: 1px solid #E9DFD8; border-radius: 14px; }
        .warning-title { color: #C43D24; }
        .btn-delete { background: #C43D24; color: white; border: none; }
        .btn-delete:hover { background: #9F2F1D; color: white; }
        .btn-cancel { background: #E9DFD8; color: #302522; border: none; }
        .btn-cancel:hover { background: #D9CCC4; color: #211C1B; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand fw-bold">
            Safe<span>Haven</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <div class="navbar-nav ms-auto align-items-lg-center">
                <a href="{% url 'home' %}" class="nav-link-custom py-2">Home</a>
                <a href="{% url 'dashboard' %}" class="nav-link-custom py-2">Dashboard</a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="delete-card shadow-sm mx-auto text-center p-4 p-md-5" style="max-width: 520px;">
        <h3 class="warning-title fw-bold mb-3">Delete Resource</h3>
        <p class="text-secondary">Are you sure you want to permanently delete this resource?</p>

        <h5 class="fw-bold mb-4">{{ resource.name }}</h5>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center flex-wrap gap-2">
                <button type="submit" class="btn btn-delete px-4">Yes, Delete</button>
                <a href="{% url 'resource_list' %}" class="btn btn-cancel px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
